<section class="admin-gallery">
  <div class="gallery-upload">

    <div class="upload-drop" (click)="openFileDialog()" (dragover)="onDragOver($event)" (drop)="onDrop($event)">
      <p>Arrastrá imágenes acá o hacé click para subir</p>
      <input type="file" #fileInput hidden multiple accept="image/*" (change)="onFileSelected($event)" />
    </div>

    <button class="btn-save" (click)="saveImages()">Guardar</button>
  </div>

  <div class="gallery-preview">
    <h2>Vista previa</h2>

    <div class="preview-grid">
      <ng-container *ngIf="previewImages.length; else empty">
        <img *ngFor="let img of previewImages" [src]="img" alt="Preview" />
      </ng-container>
      <ng-template #empty>
        <p class="no-preview">No hay imágenes para mostrar</p>
      </ng-template>
    </div>
  </div>
</section>
