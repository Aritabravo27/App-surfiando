<section class="events-section">
    <h2 class="events-title">eventos</h2>

    <div class="events-grid">

        <section class="event-list" aria-live="polite">
            <div class="event-list__controls">
                <button class="btn btn--ghost" *ngIf="hasFilter" (click)="clearFilter()">Ver todos</button>
            </div>

            <ng-container *ngIf="visibleEvents().length; else emptyState">
                <article class="event" *ngFor="let e of visibleEvents()">
                    <h4 class="event__title">{{ e.title }}</h4>
                    <div class="event__meta">
                        <svg class="event__icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path
                                d="M7 2v2H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2V2h-2v2H9V2H7zm12 6H5v10h14V8z" />
                        </svg>
                        <time [attr.datetime]="e.start.toISOString()">
                            {{ fmtDate(e.start) }} · {{ fmtTime(e.start) }}hs
                        </time>
                    </div>
                    <a href="e.url"><button class="info-button">Info</button></a>
                </article>
            </ng-container>

            <ng-template #emptyState>
                <p class="empty">No hay eventos para esta selección.</p>
            </ng-template>
        </section>
    </div>
</section>
