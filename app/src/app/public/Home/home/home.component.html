<div class="center-wrapper">
  <header>
    <h1 style="-webkit-text-stroke: 2px #000000;">.proyecto SUR FIANDO</h1>
  </header>
  <div class="parent">
    <div class="children-grid-1" (click)="openPopup('musica')">
      <p>Música</p>
    </div>
    <div class="children-grid-2" (click)="openPopup('acerca')">
      <p>Acerca de...</p>
    </div>
    <div class="children-grid-3" (click)="openPopup('eventos')">
      <p>Eventos</p>
    </div>
    <div class="children-grid-4" (click)="openPopup('galeria')">
      <p>Galería</p>
    </div>
    <div class="children-grid-5" (click)="openPopup('merch')">
      <p>Merch</p>
    </div>
  </div>

  <footer class="site-footer">
    <p class="contact-footer">
      Contactanos:
      <a [href]="social.email">{{ emailDisplay }}</a>
      <ng-container *ngIf="phoneHref">
        · <a [href]="phoneHref">{{ social.phone }}</a>
      </ng-container>
    </p>
    <div class="site-footer__social">
      <a [href]="social.instagram" target="_blank" rel="noopener noreferrer">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="Instagram" width="24" height="24" class="ig">
          <rect x="3" y="3" width="18" height="18" rx="4" ry="4" fill="none" stroke="currentColor" stroke-width="2" />
          <circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="2" />
          <circle cx="17.5" cy="6.5" r="1.5" fill="currentColor" />
        </svg>
      </a>
      <a [href]="social.youtube" target="_blank" rel="noopener noreferrer">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="YouTube" width="24" height="24">
          <rect x="2" y="4" width="20" height="16" rx="4" ry="4" fill="none" stroke="currentColor" stroke-width="2" />
          <polygon points="10,9 16,12 10,15" fill="currentColor" />
        </svg>
      </a>
      <a [href]="social.spotify" target="_blank" rel="noopener noreferrer">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="Spotify" width="24" height="24">
          <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2" />
          <path d="M6.4 9 Q12 7 17.6 10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          <path d="M7.6 12 Q12 10.8 16.4 13.3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          <path d="M9 15 Q12 14.5 14.6 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        </svg>
      </a>
      <a [href]="social.bandcamp" target="_blank" rel="noopener noreferrer">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="Bandcamp" width="24" height="24">
          <circle cx="10" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2" />
          <polygon points="7,8 17,8 13,16 3,16" fill="currentColor" />
        </svg>
      </a>
    </div>
  </footer>
</div>
